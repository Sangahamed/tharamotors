<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tharamotors — site en cours de déploiement</title>
<meta name="description" content="Le site Tharamotors est en cours de mise en ligne. Nos équipes restent joignables par téléphone et par email.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/logo.png">
<style>
  :root {
    --primary: #1800AD;
    --primary-deep: #14007C;
    --accent: #FFA500;
    --ink: #F5F6FF;
    --muted: rgba(245, 246, 255, .72);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 20% 15%, #2D46C7 0%, var(--primary) 42%, var(--primary-deep) 100%);
  }
  .card {
    width: 100%;
    max-width: 40rem;
    text-align: center;
  }
  .logo {
    width: 132px;
    max-width: 55%;
    height: auto;
    margin: 0 auto 2rem;
    display: block;
  }
  .wordmark {
    margin-bottom: 2rem;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: .12em;
  }
  .wordmark span { color: var(--accent); }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    padding: .4rem .95rem;
    border-radius: 999px;
    background: rgba(255, 165, 0, .14);
    border: 1px solid rgba(255, 165, 0, .45);
    color: var(--accent);
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .dot {
    width: .5rem;
    height: .5rem;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .35; transform: scale(.7); }
  }
  h1 {
    margin: 1.5rem 0 0;
    font-size: clamp(1.75rem, 5vw, 2.75rem);
    line-height: 1.15;
    font-weight: 700;
  }
  p.lead {
    margin: 1rem auto 0;
    max-width: 32rem;
    font-size: 1.03rem;
    line-height: 1.65;
    color: var(--muted);
  }
  .contact {
    margin-top: 2.5rem;
    padding-top: 2rem;
    border-top: 1px solid rgba(255, 255, 255, .14);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .75rem;
  }
  .contact a {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    padding: .7rem 1.35rem;
    border-radius: .65rem;
    font-size: .95rem;
    font-weight: 600;
    text-decoration: none;
    transition: transform .15s ease, background-color .15s ease;
  }
  .contact a:hover { transform: translateY(-2px); }
  .btn-solid  { background: var(--accent); color: #2B1400; }
  .btn-solid:hover { background: #FFB63B; }
  .btn-ghost  { background: rgba(255, 255, 255, .08); color: var(--ink); border: 1px solid rgba(255, 255, 255, .22); }
  .btn-ghost:hover { background: rgba(255, 255, 255, .16); }
  footer {
    margin-top: 2.5rem;
    font-size: .8rem;
    color: rgba(245, 246, 255, .5);
  }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .contact a { transition: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <!-- Si images/logo.png n'a pas encore ete televerse, on bascule sur le
         nom en toutes lettres plutot que d'afficher une image cassee. -->
    <img class="logo" src="images/logo.png" alt="Tharamotors"
         onerror="this.remove(); document.getElementById('wordmark').hidden = false;">
    <div id="wordmark" class="wordmark" hidden>THARA<span>MOTORS</span></div>

    <span class="badge"><span class="dot"></span> Mise en ligne en cours</span>

    <h1>Notre nouveau site arrive</h1>

    <p class="lead">
      Le site Tharamotors est en cours de déploiement. Nos équipes restent
      pleinement disponibles pour vos demandes de véhicules, d'engins et de devis.
    </p>

    <div class="contact">
      <a class="btn-solid" href="tel:+2250501101212">+225 05 01 10 12 12</a>
      <a class="btn-ghost" href="mailto:contact@tharamotors.com">contact@tharamotors.com</a>
    </div>

    <footer>&copy; 2026 Tharamotors — Abidjan, Côte d'Ivoire</footer>
  </main>
</body>
</html>
